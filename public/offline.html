<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; }
      .box { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 10px 0 0; color: #475569; font-size: 14px; line-height: 1.5; }
      a { color: #2d5016; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Você está offline</h1>
      <p>Abra a app ao menos 1 vez com internet para baixar tudo. Depois ela funciona sem internet.</p>
      <p><a href="/">Tentar abrir</a></p>
    </div>
  </body>
</html>
