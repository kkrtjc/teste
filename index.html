<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mura Manager" />
    <meta name="theme-color" content="#070709" />
    <link rel="manifest" href="/manifest.json" />
    <title>Mura Manager - Elite Poultry System</title>
    <style>
      /* Estilos imediatos de 0ms para o splash antes do JS baixar */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #070709;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #instant-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #070709;
        z-index: 99999;
      }
      .splash-logo-container {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 24px;
        overflow: hidden;
        border: 2px solid rgba(245, 158, 11, 0.5);
        box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.3);
        background: #000;
        margin-bottom: 20px;
        animation: splash-pulse 2s ease-in-out infinite alternate;
      }
      .splash-logo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .splash-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
        margin: 0 0 6px 0;
        text-align: center;
      }
      .splash-title span {
        color: #fbbf24;
      }
      .splash-subtitle {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(253, 230, 138, 0.7);
        margin: 0 0 24px 0;
        text-align: center;
      }
      .splash-bar-bg {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar-fill {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #f59e0b, #ea580c, #f59e0b);
        background-size: 200% 100%;
        border-radius: 999px;
        animation: splash-loading 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0% { transform: scale(0.98); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.2)); }
        100% { transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.45)); }
      }
      @keyframes splash-loading {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash Screen Nativo de 0ms: aparece no milissegundo zero enquanto o JS baixa -->
      <div id="instant-splash">
        <div class="splash-logo-container">
          <img src="/logo.jpg" alt="Mura Manager" class="splash-logo-img" />
        </div>
        <h1 class="splash-title">MURA <span>MANAGER</span></h1>
        <p class="splash-subtitle">Gestão Inteligente de Criatórios</p>
        <div class="splash-bar-bg">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado com sucesso:', reg.scope))
            .catch(err => console.error('Erro ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
